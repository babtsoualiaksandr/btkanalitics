{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена — BTK Analitics</title>
  <link rel="icon" href="{% static 'agromash/favicon.svg' %}" />
  <link rel="stylesheet" href="{% static 'agromash/btk.css' %}?v=20260219d" />
  <style>
    .btk-error {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 24px;
    }
    .btk-error__code { font-size: 64px; font-weight: 700; color: var(--btk-blue); line-height: 1; }
    .btk-error__title { font-size: 20px; font-weight: 600; color: var(--btk-text); }
    .btk-error__hint { color: var(--btk-muted); max-width: 420px; }
  </style>
</head>
<body>
  <header class="btk-header">
    <div class="btk-header__inner">
      <a class="btk-brand" href="/">
        <img class="btk-brand__logo" src="{% static 'agromash/btk-logo.svg' %}" alt="Белтелеком" />
        <span class="btk-brand__title">BTK Analitics</span>
      </a>
    </div>
  </header>
  <main class="btk-error">
    <div class="btk-error__code">404</div>
    <div class="btk-error__title">Страница не найдена</div>
    <p class="btk-error__hint">Такой страницы не существует или она была перемещена. Проверьте адрес или вернитесь на главную.</p>
    <a class="btk-btn btk-btn--small" href="/">На главную</a>
  </main>
</body>
</html>
