<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTK Reports</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #0e1621;
        --section-bg: #17212b;
        --text: #ffffff;
        --hint: #6d7f8f;
        --accent: #4ea4e8;
        --accent-text: #ffffff;
        --separator: #0a121a;
        --destructive: #ec4e4e;
        --success: #4fce5d;
        --track-off: #2b3a48;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overscroll-behavior-y: none;
      }
      a { color: var(--accent); text-decoration: none; }
      header {
        position: sticky; top: 0; z-index: 5;
        padding: 14px 16px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--separator);
        display: flex; align-items: center; gap: 10px;
      }
      header h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
      #meta { color: var(--hint); font-size: 12.5px; margin-top: 1px; }
      .back-btn {
        width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--section-bg); cursor: pointer; border: none;
      }
      main { padding: 0 0 32px; }
      .section-title {
        font-size: 12.5px; font-weight: 600; color: var(--hint);
        text-transform: uppercase; letter-spacing: .4px;
        padding: 18px 16px 6px;
      }
      .card { background: var(--section-bg); border-radius: 10px; overflow: hidden; margin: 0 16px; }
      .card.pad { padding: 12px 16px; }
      .row {
        display: flex; align-items: center; gap: 12px;
        padding: 12px 16px; min-height: 44px;
      }
      .row.tap { cursor: pointer; }
      .row.tap:active { background: color-mix(in srgb, var(--text) 6%, transparent); }
      .divider { height: 1px; background: var(--separator); margin-left: 16px; }
      .muted { color: var(--hint); }
      .icon-wrap {
        width: 29px; height: 29px; border-radius: 8px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .icon-wrap svg { stroke: var(--accent); }

      .switch { width: 44px; height: 26px; border-radius: 14px; position: relative; flex-shrink: 0; cursor: pointer; transition: background .15s; }
      .switch .knob { width: 22px; height: 22px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
      .switch.on { background: var(--accent); }
      .switch.off { background: var(--track-off); }
      .switch.on .knob { left: 20px; }

      .top16 { margin-top: 16px; }
      .top12 { margin-top: 12px; }

      .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        padding: 7px 13px; border-radius: 8px; font-size: 13px; font-weight: 600;
        white-space: nowrap; cursor: pointer; background: var(--bg); color: var(--text);
        border: none; font-family: inherit;
      }
      .chip.active { background: var(--accent); color: var(--accent-text); }
      .chip.block { flex: 1; text-align: center; }

      .stepper { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
      .stepper-btn {
        width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; border: none;
        display: flex; align-items: center; justify-content: center; background: var(--bg); cursor: pointer;
      }
      .stepper-btn svg { fill: var(--text); }
      .stepper-val { font-size: 14px; min-width: 70px; text-align: center; }

      input[type=email], input[type=datetime-local] {
        border: none; outline: none; background: transparent; color: var(--text);
        font-size: 15px; width: 100%; font-family: inherit; color-scheme: dark;
      }
      input[type=email] { text-align: right; }
      input[type=email]::placeholder { color: var(--hint); }

      .toast {
        margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; font-size: 13px;
        background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
      }
      .error-banner {
        margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; font-size: 13px;
        background: color-mix(in srgb, var(--destructive) 15%, transparent); color: var(--destructive);
        white-space: pre-wrap;
      }
      .empty { padding: 40px 16px; text-align: center; color: var(--hint); font-size: 14px; }
      .skeleton { padding: 16px; color: var(--hint); font-size: 14px; text-align: center; }

      .footer-hint { padding: 14px 16px 0; font-size: 12px; color: var(--hint); line-height: 1.5; }

      /* Нативный MainButton у Telegram появляется сам (см. tg.MainButton) — этот
         фолбэк используется только когда Mini App открыт вне Telegram (например,
         для проверки в обычном браузере). */
      #fallbackMainBtn {
        display: none;
        background: var(--accent); color: var(--accent-text);
        text-align: center; font-weight: 600; font-size: 16px;
        padding: 16px; margin: 16px; border-radius: 10px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="backBtn" class="back-btn" style="display:none;" aria-label="Назад">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L1.5 8L8 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div>
        <h1 id="title">BTK Reports</h1>
        <div id="meta"></div>
      </div>
    </header>
    <main>
      <div id="errorBox"></div>
      <div id="screen"><div class="skeleton">Загрузка…</div></div>
      <div id="fallbackMainBtn"></div>
    </main>

    <script>
      const tg = window.Telegram?.WebApp;
      if (tg) { tg.ready(); tg.expand(); }
      const initData = tg?.initData || "";

      const FREQ_LABEL = { '10m': '10 мин', 'hourly': 'Час', 'daily': 'День', 'weekly': 'Неделя', 'monthly': 'Месяц' };
      const FREQ_HUMAN = { '10m': 'Каждые 10 минут', 'hourly': 'Каждый час', 'daily': 'Ежедневно', 'weekly': 'Еженедельно', 'monthly': 'Ежемесячно' };
      const CH_LABEL = { telegram: 'Telegram', email: 'Email', both: 'Оба' };

      // ---------- theme: подхватываем реальную тему Telegram, а не жёстко зашитую ----------
      function applyTheme() {
        const p = tg?.themeParams || {};
        const root = document.documentElement.style;
        const set = (name, value) => { if (value) root.setProperty(name, value); };
        set('--bg', p.bg_color);
        set('--section-bg', p.section_bg_color || p.secondary_bg_color);
        set('--text', p.text_color);
        set('--hint', p.hint_color || p.subtitle_text_color);
        set('--accent', p.button_color || p.link_color);
        set('--accent-text', p.button_text_color);
        set('--destructive', p.destructive_text_color);
        try {
          const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
          tg?.setHeaderColor?.(bg || '#0e1621');
          tg?.setBackgroundColor?.(bg || '#0e1621');
        } catch (e) { /* старые клиенты Telegram могут не поддерживать — не критично */ }
      }
      applyTheme();
      tg?.onEvent?.('themeChanged', applyTheme);

      function haptic(kind) {
        try { tg?.HapticFeedback?.impactOccurred?.(kind || 'light'); } catch (e) {}
      }

      // ---------- DOM helpers (тот же паттерн, что был в проекте) ----------
      function el(tag, attrs = {}, children = []) {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') e.className = v;
          else if (k === 'html') e.innerHTML = v;
          else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
          else e.setAttribute(k, v);
        }
        for (const c of children) e.appendChild(c);
        return e;
      }
      const text = (s) => document.createTextNode(s);

      function sectionTitle(label) { return el('div', { class: 'section-title', html: label }); }
      function card(children = [], padClass = '') { return el('div', { class: 'card ' + padClass }, children); }
      function divider() { return el('div', { class: 'divider' }); }

      function switchEl(onValue, onToggle) {
        const s = el('div', { class: 'switch ' + (onValue ? 'on' : 'off') }, [el('div', { class: 'knob' })]);
        s.addEventListener('click', () => { haptic('light'); onToggle(); });
        return s;
      }

      function chipRow(options, activeKey, onSelect, blockStyle) {
        const wrap = el('div', { class: 'chip-row' });
        for (const opt of options) {
          const c = el('button', { class: 'chip' + (opt.key === activeKey ? ' active' : '') + (blockStyle ? ' block' : ''), type: 'button' }, [text(opt.label)]);
          c.addEventListener('click', () => { haptic('light'); onSelect(opt.key); });
          wrap.appendChild(c);
        }
        return wrap;
      }

      function iconWrap(pathSvg) { return el('div', { class: 'icon-wrap', html: pathSvg }); }

      const ICON_BELL = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5c-2.2 0-3.8 1.7-3.8 4v2.3L2.7 10.4c-.3.4 0 1 .5 1h9.6c.5 0 .8-.6.5-1L11.8 7.8V5.5c0-2.3-1.6-4-3.8-4Z" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 13.2a1.6 1.6 0 0 0 3 0" stroke-width="1.4" stroke-linecap="round"/></svg>';
      const ICON_DOC = '<svg width="15" height="16" viewBox="0 0 15 16" fill="none"><rect x="1.5" y="1" width="12" height="14" rx="1.5" stroke-width="1.4"/><path d="M4.5 5h6M4.5 8h6M4.5 11h3.5" stroke-width="1.3" stroke-linecap="round"/></svg>';
      const ICON_CHEVRON = '<svg width="7" height="12" viewBox="0 0 7 12" fill="none" style="flex-shrink:0;"><path d="M1 1L6 6L1 11" stroke="var(--hint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const ICON_MINUS = '<svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="2" rx="1"/></svg>';
      const ICON_PLUS = '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="4" width="2" height="10" rx="1"/><rect y="4" width="10" height="2" rx="1"/></svg>';

      function setError(msg) {
        const box = document.getElementById('errorBox');
        box.innerHTML = '';
        if (msg) box.appendChild(el('div', { class: 'error-banner' }, [text(msg)]));
      }

      async function api(path, body = null) {
        const opt = {
          method: body ? 'POST' : 'GET',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
        };
        if (body) opt.body = JSON.stringify(body);
        const resp = await fetch(path, opt);
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || (resp.status + ' ' + resp.statusText));
        return data;
      }

      function fmtDate(iso) {
        if (!iso) return null;
        try {
          const d = new Date(iso);
          return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return null; }
      }

      // ---------- MainButton: нативный у Telegram, фолбэк-кнопка вне Telegram ----------
      function showMainButton(label, onClick) {
        const fb = document.getElementById('fallbackMainBtn');
        if (tg?.MainButton) {
          fb.style.display = 'none';
          tg.MainButton.setText(label);
          tg.MainButton.offClick(tg.MainButton._lastHandler || (() => {}));
          tg.MainButton._lastHandler = onClick;
          tg.MainButton.onClick(onClick);
          tg.MainButton.show();
        } else {
          fb.style.display = 'block';
          fb.textContent = label;
          fb.onclick = onClick;
        }
      }
      function hideMainButton() {
        if (tg?.MainButton) tg.MainButton.hide();
        document.getElementById('fallbackMainBtn').style.display = 'none';
      }

      // ---------- state ----------
      let monitors = [];
      let subscriptions = [];

      function renderList() {
        hideMainButton();
        tg?.BackButton?.hide?.();
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('title').textContent = 'BTK Reports';
        const u = tg?.initDataUnsafe?.user;
        document.getElementById('meta').textContent = u ? `@${u.username || ''} · id ${u.id}` : '';

        const screen = document.getElementById('screen');
        screen.innerHTML = '';

        if (monitors.length) {
          screen.appendChild(sectionTitle('Мониторы алярмов'));
          const rows = [];
          monitors.forEach((m, i) => {
            const sw = switchEl(m.enabled, async () => {
              try {
                const res = await api(`/tg/api/alarm-monitors/${m.monitor_pk}/set-enabled/`, { enabled: !m.enabled });
                m.enabled = !!res.monitor?.enabled;
                renderList();
              } catch (e) { setError(String(e.message || e)); }
            });
            rows.push(el('div', { class: 'row' }, [
              iconWrap(ICON_BELL),
              el('div', { style: 'flex:1; min-width:0;' }, [
                el('div', { style: 'font-size:15px;' }, [text(m.monitor_name)]),
                el('div', { class: 'muted', style: 'font-size:12.5px; margin-top:1px;' }, [text('ID ' + m.monitor_id)]),
              ]),
              sw,
            ]));
            if (i < monitors.length - 1) rows.push(divider());
          });
          screen.appendChild(card(rows));
        }

        screen.appendChild(sectionTitle('Подписки на отчёты'));
        if (!subscriptions.length) {
          screen.appendChild(card([el('div', { class: 'empty' }, [text('У вас нет подписок на отчёты.')])]));
        } else {
          const rows = [];
          subscriptions.forEach((s, i) => {
            const monitorsLabel = s.monitors.length ? s.monitors.map(m => m.monitor_name || ('ID ' + m.monitor_id)).join(', ') : 'Все мониторы';
            const row = el('div', { class: 'row tap' }, [
              iconWrap(ICON_DOC),
              el('div', { style: 'flex:1; min-width:0;' }, [
                el('div', { style: 'display:flex; align-items:center; gap:6px;' }, [
                  el('span', { style: `width:7px;height:7px;border-radius:50%;background:${s.enabled ? 'var(--success)' : 'var(--hint)'};flex-shrink:0;` }),
                  el('span', { style: 'font-size:15px; font-weight:600;' }, [text('Подписка #' + s.id)]),
                ]),
                el('div', { class: 'muted', style: 'font-size:12.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;' }, [
                  text(`${FREQ_HUMAN[s.frequency] || s.frequency} · ${monitorsLabel}`),
                ]),
              ]),
              el('div', { html: ICON_CHEVRON }),
            ]);
            row.addEventListener('click', () => renderDetails(s.id));
            rows.push(row);
            if (i < subscriptions.length - 1) rows.push(divider());
          });
          screen.appendChild(card(rows));
        }

        if (monitors.length) {
          screen.appendChild(el('div', { class: 'footer-hint' }, [
            text('Список мониторов назначает администратор — здесь можно только включать и выключать уведомления по ним.'),
          ]));
        }
      }

      function renderDetails(subId) {
        const s = subscriptions.find(x => x.id === subId);
        if (!s) return renderList();

        document.getElementById('backBtn').style.display = 'flex';
        document.getElementById('backBtn').onclick = renderList;
        tg?.BackButton?.show?.();
        tg?.BackButton?.offClick?.(tg.BackButton._lastHandler || (() => {}));
        tg.BackButton && (tg.BackButton._lastHandler = renderList);
        tg?.BackButton?.onClick?.(renderList);

        document.getElementById('title').textContent = 'Подписка #' + s.id;
        const metaBits = [];
        const last = fmtDate(s.last_sent_at);
        const next = fmtDate(s.next_run_at);
        if (last) metaBits.push('Отправлено: ' + last);
        if (next && s.enabled) metaBits.push('Следующая: ' + next);
        document.getElementById('meta').textContent = metaBits.join(' · ') || 'Ещё не отправлялось';

        setError('');
        const screen = document.getElementById('screen');
        screen.innerHTML = '';

        let rangeOpen = false;

        function statusToast(msg) {
          const old = screen.querySelector('.toast');
          if (old) old.remove();
          screen.appendChild(el('div', { class: 'toast' }, [text(msg)]));
        }

        // Статус
        screen.appendChild(card([
          el('div', { class: 'row' }, [
            el('div', { style: 'flex:1; font-size:15px;' }, [text('Подписка активна')]),
            switchEl(s.enabled, () => { s.enabled = !s.enabled; renderDetails(subId); }),
          ]),
        ], 'top16'));

        // Получатель
        screen.appendChild(sectionTitle('Получатель'));
        const emailInput = el('input', { type: 'email', placeholder: 'email@domain.com', value: s.email || '' });
        emailInput.addEventListener('change', () => { s.email = emailInput.value; });
        screen.appendChild(card([
          el('div', { class: 'row' }, [
            el('div', { style: 'font-size:15px; flex-shrink:0;' }, [text('Email')]),
            emailInput,
          ]),
        ]));

        // Расписание
        screen.appendChild(sectionTitle('Расписание'));
        const freqBox = el('div', {});
        function renderFreq() {
          freqBox.innerHTML = '';
          freqBox.appendChild(chipRow(
            Object.keys(FREQ_LABEL).map(k => ({ key: k, label: FREQ_LABEL[k] })),
            s.frequency,
            (key) => { s.frequency = key; renderFreq(); },
          ));
        }
        renderFreq();

        const periodBox = el('div', {});
        function renderPeriod() {
          periodBox.innerHTML = '';
          periodBox.appendChild(el('div', { class: 'muted', style: 'font-size:12.5px; margin-bottom:8px;' }, [
            text(`Окно отчёта: от ${s.period_from_minutes} до ${s.period_to_minutes} мин назад`),
          ]));
          const mkStepper = (label, get, set, minus, plus) => el('div', { class: 'stepper' }, [
            el('div', { style: 'font-size:14px;' }, [text(label)]),
            el('div', { style: 'display:flex; align-items:center; gap:10px;' }, [
              el('button', { class: 'stepper-btn', type: 'button', html: ICON_MINUS, onClick: () => { minus(); renderPeriod(); } }),
              el('div', { class: 'stepper-val' }, [text(get() + ' мин')]),
              el('button', { class: 'stepper-btn', type: 'button', html: ICON_PLUS, onClick: () => { plus(); renderPeriod(); } }),
            ]),
          ]);
          periodBox.appendChild(mkStepper('Начало окна',
            () => s.period_from_minutes,
            null,
            () => { s.period_from_minutes = Math.max(s.period_to_minutes + 15, s.period_from_minutes - 15); },
            () => { s.period_from_minutes += 15; }));
          periodBox.appendChild(mkStepper('Конец окна',
            () => s.period_to_minutes,
            null,
            () => { s.period_to_minutes = Math.max(0, s.period_to_minutes - 15); },
            () => { s.period_to_minutes = Math.min(s.period_from_minutes - 15, s.period_to_minutes + 15); }));
        }
        renderPeriod();

        screen.appendChild(card([
          freqBox,
          el('div', { style: 'height:1px; background:var(--separator); margin:14px 0 12px;' }),
          periodBox,
        ], 'pad'));

        // Формат файлов
        screen.appendChild(sectionTitle('Формат файлов'));
        const pdfSw = switchEl(s.send_pdf, () => { s.send_pdf = !s.send_pdf; renderDetails(subId); });
        const xlsxSw = switchEl(s.send_xlsx, () => { s.send_xlsx = !s.send_xlsx; renderDetails(subId); });
        screen.appendChild(card([
          el('div', { class: 'row' }, [el('div', { style: 'flex:1; font-size:15px;' }, [text('PDF')]), pdfSw]),
          divider(),
          el('div', { class: 'row' }, [el('div', { style: 'flex:1; font-size:15px;' }, [text('XLSX')]), xlsxSw]),
        ]));

        // Отправить
        screen.appendChild(sectionTitle('Отправить'));
        let channel = 'telegram';
        const channelBox = el('div', {});
        function renderChannel() {
          channelBox.innerHTML = '';
          channelBox.appendChild(chipRow(
            Object.keys(CH_LABEL).map(k => ({ key: k, label: CH_LABEL[k] })),
            channel,
            (key) => { channel = key; renderChannel(); },
            true,
          ));
        }
        renderChannel();
        screen.appendChild(card([channelBox], 'pad'));

        const rangeSlot = el('div', {});
        const sendNowRow = el('div', { class: 'row tap' }, [el('div', { style: 'flex:1; color:var(--accent); font-size:15px;' }, [text('Отправить сейчас')])]);
        sendNowRow.addEventListener('click', async () => {
          try {
            const data = await api(`/tg/api/subscriptions/${s.id}/send-now/`, { channel });
            statusToast('Поставлено в очередь: ' + data.task_ids.join(', '));
            haptic('medium');
          } catch (e) { setError(String(e.message || e)); }
        });

        const rangeRow = el('div', { class: 'row tap' }, [el('div', { style: 'flex:1; color:var(--accent); font-size:15px;' }, [text('За произвольный период…')])]);
        rangeRow.addEventListener('click', () => { rangeOpen = !rangeOpen; renderRangeSlot(); });

        function renderRangeSlot() {
          rangeSlot.innerHTML = '';
          if (!rangeOpen) return;
          const now = new Date();
          const dayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
          const toLocalInput = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
          const start = el('input', { type: 'datetime-local', value: toLocalInput(dayAgo) });
          const end = el('input', { type: 'datetime-local', value: toLocalInput(now) });
          const sendBtn = el('div', { class: 'row tap' }, [el('div', { style: 'flex:1; color:var(--accent); font-size:15px; text-align:center;' }, [text('Отправить диапазон')])]);
          sendBtn.addEventListener('click', async () => {
            try {
              const data = await api(`/tg/api/subscriptions/${s.id}/send-range/`, { channel, start: start.value, end: end.value });
              statusToast('Диапазон поставлен в очередь: ' + data.task_ids.join(', '));
              haptic('medium');
            } catch (e) { setError(String(e.message || e)); }
          });
          rangeSlot.appendChild(card([
            el('div', { class: 'row' }, [el('div', { style: 'font-size:14px;' }, [text('Начало')]), start]),
            divider(),
            el('div', { class: 'row' }, [el('div', { style: 'font-size:14px;' }, [text('Конец')]), end]),
          ], 'top12'));
          rangeSlot.appendChild(card([sendBtn]));
        }
        renderRangeSlot();

        screen.appendChild(card([sendNowRow, divider(), rangeRow]));
        screen.appendChild(rangeSlot);

        function save(extra, showToast) {
          const payload = Object.assign({
            email: s.email,
            frequency: s.frequency,
            period_from_minutes: s.period_from_minutes,
            period_to_minutes: s.period_to_minutes,
            send_pdf: s.send_pdf,
            send_xlsx: s.send_xlsx,
            enabled: s.enabled,
          }, extra || {});
          return api(`/tg/api/subscriptions/${s.id}/update/`, payload).then((data) => {
            Object.assign(s, data.subscription);
            if (showToast !== false) statusToast('Сохранено');
            haptic('medium');
          }).catch((e) => setError(String(e.message || e)));
        }

        showMainButton('Сохранить', () => save({}, true));
      }

      async function boot() {
        try {
          if (!initData) throw new Error('Telegram initData отсутствует (открывайте страницу внутри Telegram).');
          const [subsData, monData] = await Promise.all([
            api('/tg/api/subscriptions/'),
            api('/tg/api/alarm-monitors/'),
          ]);
          subscriptions = subsData.subscriptions || [];
          monitors = monData.monitors || [];
          renderList();
        } catch (e) {
          document.getElementById('screen').innerHTML = '';
          setError(String(e.message || e));
        }
      }
      boot();
    </script>
  </body>
</html>
