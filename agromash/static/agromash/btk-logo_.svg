<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48">
  <!--
    Логотип для шапки админки: знак + надпись «Белтелеком».
    Сделано в едином прямоугольнике, под фиолетовую тему.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a1b9a"/>
      <stop offset="1" stop-color="#8e24aa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="220" height="48" rx="10" fill="#ffffff"/>

  <!-- Стилизованный знак (ДНК-спираль) слева -->
  <g transform="translate(12,8)">
    <path d="M8 0 C 14 3, 14 13, 8 16 C 2 19, 2 29, 8 32" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M24 0 C 18 3, 18 13, 24 16 C 30 19, 30 29, 24 32" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <g stroke="#6a1b9a" stroke-opacity="0.85" stroke-linecap="round">
      <line x1="10" y1="4" x2="22" y2="4" stroke-width="1.6"/>
      <line x1="9" y1="10" x2="23" y2="10" stroke-width="1.8"/>
      <line x1="8" y1="16" x2="24" y2="16" stroke-width="2.0"/>
      <line x1="9" y1="22" x2="23" y2="22" stroke-width="1.8"/>
      <line x1="10" y1="28" x2="22" y2="28" stroke-width="1.6"/>
    </g>
    <circle cx="26" cy="2" r="1.8" fill="#8e24aa"/>
  </g>

  <!-- Надпись занимает основную площадь -->
  <text x="58" y="32" fill="#4a148c" font-size="22" font-weight="700"
        font-family="DejaVu Sans, Arial, Helvetica, sans-serif" letter-spacing="0.2">
    Белтелеком
  </text>
</svg>

