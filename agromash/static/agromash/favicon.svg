<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- favicon: точный знак из предоставленного изображения -->
  <defs>
    <clipPath id="r">
      <rect x="4" y="4" width="56" height="56" rx="12" />
    </clipPath>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="12" fill="#ffffff"/>
  <image
    x="4" y="4" width="56" height="56"
    clip-path="url(#r)"
    preserveAspectRatio="xMidYMid slice"
    href="data:image/jpeg;base64,"
  />
</svg>
