# Nginx конфигурация для btkanalitics — блок для ЭТОГО сервера (10.0.0.2).
#
# ВАЖНО: это не единственный хоп. Публичный домен btkanylitics.babtsou.uk
# идёт по цепочке из ТРЁХ разных хостов, каждый со своим отдельным nginx-
# конфигом, который НЕ хранится в этом репозитории и НЕ синхронизируется
# автоматически:
#
#   Cloudflare
#     -> nginx:443 "ssl_proxy_root" на 52.207.37.113 (публичная VPS)
#     -> nginx:80  "btkanylitics"   на 10.0.0.5       (внутренний прокси)
#     -> nginx:9091 (этот файл)     на 10.0.0.2       (этот сервер)
#     -> gunicorn:8091
#
# Каждый хоп должен пробрасывать X-Forwarded-Proto без перезаписи через
# $scheme (см. proxy_set_header ниже) — иначе request.is_secure() в Django
# всегда будет False. Проверять СТРОГО через staff-only debug-логику
# (временный /agromash/_debug/headers/, если понадобится восстановить)
# или добавлением уникального access_log на каждый хост — не полагаться
# на отсутствие видимого редиректа как на доказательство.
#
# Установка НА ЭТОМ сервере:
#   sudo cp deploy/nginx/btkanalitics.conf /etc/nginx/sites-enabled/btkanalitics
#   sudo nginx -t && sudo systemctl reload nginx
#
# `git pull` в этом репозитории НЕ обновляет живой /etc/nginx/sites-enabled/
# автоматически — после любой правки этого файла обязательно вручную
# скопировать и перезагрузить nginx, иначе изменения останутся только
# в git и никак не повлияют на прод (именно так был потерян фикс
# X-Forwarded-Proto в 2026-08).
#
# Перед перезагрузкой nginx выполните:
#   cd /home/sshbeltelecom/va/btkanalitics
#   python manage.py collectstatic --noinput

server {
    listen 9091;
    server_name 10.0.0.2;

    # Статические файлы Django (admin, agromash и т.д.)
    # Путь должен совпадать с STATIC_ROOT в settings.py: BASE_DIR / 'staticfiles'
    location /static/ {
        alias /home/sshbeltelecom/va/btkanalitics/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /media/ сознательно НЕ отдаётся напрямую с диска: там лежат
    # AlarmDocument (документы по тревогам), доступ к которым проверяется
    # в Django-view alarm_document_file (agromash/views_events.py). Прямой
    # alias здесь полностью обходил бы эту авторизацию.

    # robots.txt из исходной директории static
    location = /robots.txt {
        alias /home/sshbeltelecom/va/btkanalitics/static/robots.txt;
    }

    # Всё остальное — прокси на Django (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Robots-Tag "noindex, nofollow";
    }
}
