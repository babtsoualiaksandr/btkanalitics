# Nginx конфигурация для btkanalitics
#
# Установка:
#   sudo cp deploy/nginx/btkanalitics.conf /etc/nginx/sites-available/btkanalitics
#   sudo ln -s /etc/nginx/sites-available/btkanalitics /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед перезагрузкой nginx выполните:
#   cd /home/sshbeltelecom/va/btkanalitics
#   python manage.py collectstatic --noinput

# --- HTTP (порт 80) — прокси на внутренний сервер ---
server {
    listen 80;
    server_name btkanylitics.babtsou.uk;

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://10.0.0.2:9091;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare уже проставляет X-Forwarded-Proto по исходной схеме визитора
        # (https). Нельзя перезаписывать через $scheme — соединение
        # Cloudflare -> этот nginx идёт по HTTP (порт 80), и $scheme здесь
        # всегда "http", даже для https-визитов. Пробрасываем как есть.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Внутренний сервер (порт 9091) — прокси на Django + статика ---
server {
    listen 9091;
    server_name 10.0.0.2;

    # Статические файлы Django (admin, agromash и т.д.)
    # Путь должен совпадать с STATIC_ROOT в settings.py: BASE_DIR / 'staticfiles'
    location /static/ {
        alias /home/sshbeltelecom/va/btkanalitics/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media (загруженные документы по тревогам, AlarmDocument) отдаются
    # ТОЛЬКО через авторизованный Django-view alarm_document_file — там
    # проверяется доступ пользователя к конкретной тревоге. Прямой alias
    # на диск здесь раньше полностью обходил эту проверку. Ни один шаблон
    # не ссылается на MEDIA_URL напрямую, так что alias не нужен.

    # robots.txt из исходной директории static
    location = /robots.txt {
        alias /home/sshbeltelecom/va/btkanalitics/static/robots.txt;
    }

    # Всё остальное — прокси на Django (Gunicorn/uWSGI)
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # См. комментарий в блоке :80 — пробрасываем реальную схему запроса,
        # полученную от предыдущего хопа, а не $scheme этого внутреннего hop'а.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Robots-Tag "noindex, nofollow";
    }
}
